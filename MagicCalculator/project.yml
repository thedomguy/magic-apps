name: MagicCalculator
options:
  bundleIdPrefix: com.rahulbhatt
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_GENERATED_FILE: YES
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_CFBundleDisplayName: Calculator
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  MagicCalculator:
    type: application
    platform: iOS
    sources:
      - MagicCalculator
    configFiles:
      Debug: Config/Backend.xcconfig
      Release: Config/Backend.xcconfig
    info:
      path: MagicCalculator/Info.plist
      properties:
        MagicBackendURL: $(MAGIC_BACKEND_URL)
        MagicBackendKey: $(MAGIC_BACKEND_KEY)
        # Plain http is only allowed on the local network (dev server on the Mac).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Syncs your calculations.
        # Unity link (docs/unity-link.md): Wi-Fi WebSocket server and Bluetooth LE peripheral.
        NSBonjourServices:
          - _ulink._tcp
        NSBluetoothAlwaysUsageDescription: Syncs your calculations.
        UIBackgroundModes:
          - bluetooth-peripheral
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rahulbhatt.MagicCalculator
        DEVELOPMENT_TEAM: 3F753GDA4W
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
