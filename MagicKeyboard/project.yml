name: MagicKeyboard
options:
  bundleIdPrefix: com.rahulbhatt
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_CFBundleDisplayName: Clock
targets:
  MagicKeyboard:
    type: application
    platform: iOS
    sources:
      - MagicKeyboard
    info:
      path: MagicKeyboard/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: Clock face sync.
        UILaunchScreen: {}
        UIBackgroundModes:
          - bluetooth-peripheral
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rahulbhatt.MagicKeyboard
        DEVELOPMENT_TEAM: 3F753GDA4W
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        INFOPLIST_KEY_UIStatusBarHidden: YES
